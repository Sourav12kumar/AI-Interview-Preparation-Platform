services:
  mysql:
    image: mysql:8.4
    container_name: ai-interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_interview_prep
      MYSQL_USER: interview_user
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
