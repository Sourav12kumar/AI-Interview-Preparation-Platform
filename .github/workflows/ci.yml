name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate frontend JavaScript
        run: |
          for script in src/main/resources/static/js/*.js; do
            node --check "$script"
          done
      - name: Validate code runner
        run: python3 -m unittest code-runner/test_runner.py
      - name: Run tests
        run: mvn --batch-mode --update-snapshots verify

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build production container
        run: docker build --tag ai-interview-preparation-platform:${{ github.sha }} .
      - name: Build code-runner controller
        run: docker build --tag ai-interview-code-runner:${{ github.sha }} code-runner
      - name: Start isolated-runner smoke test
        run: |
          docker run --detach --name interview-runner-smoke \
            --publish 127.0.0.1:18090:8090 \
            --env RUNNER_API_KEY=ci-runner-token-123456 \
            --env RUNNER_JAVA_IMAGE=python:3.13-alpine \
            --env RUNNER_PYTHON_IMAGE=python:3.13-alpine \
            --env RUNNER_JAVASCRIPT_IMAGE=python:3.13-alpine \
            --env RUNNER_CPP_IMAGE=python:3.13-alpine \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            ai-interview-code-runner:${{ github.sha }}
          timeout 300 sh -c 'until curl --fail --silent http://127.0.0.1:18090/health; do sleep 2; done'
      - name: Execute code through isolated runner
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          payload = {
              "problemSlug": "factorial",
              "language": "PYTHON",
              "sourceCode": "def factorial(n):\n    return 1 if n == 0 else n * factorial(n - 1)",
              "testCases": [
                  {"input": {"n": 0}, "expected": 1},
                  {"input": {"n": 5}, "expected": 120},
              ],
              "timeLimitMs": 2000,
              "memoryLimitMb": 128,
          }
          request = urllib.request.Request(
              "http://127.0.0.1:18090/v1/execute",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer ci-runner-token-123456",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["verdict"] == "ACCEPTED", result
          assert result["passedTestCases"] == 2, result
          PY
      - name: Stop isolated-runner smoke test
        if: always()
        run: docker rm --force interview-runner-smoke || true
