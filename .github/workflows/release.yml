name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci
      - name: Validate release source
        run: |
          for script in src/main/resources/static/js/*.js; do
            node --check "$script"
          done
          node --check playwright.config.js
          node --check tests/e2e/release-smoke.spec.js
          mvn --batch-mode verify
      - name: Assemble release bundle
        run: |
          mkdir -p release
          cp target/*.jar release/interview-pilot.jar
          cp .env.example release/env.example
          cp docs/release-readiness.md release/RELEASE-READINESS.md
          sha256sum release/interview-pilot.jar > release/SHA256SUMS
      - name: Build release container
        run: docker build --tag interview-pilot:${{ github.ref_name }} .
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: interview-pilot-${{ github.ref_name }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
