spring:
  datasource:
    url: jdbc:h2:mem:interview_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt:
      issuer: ai-interview-preparation-platform-test
      secret: integration-test-secret-that-is-longer-than-32-characters
      access-ttl: PT15M
      refresh-ttl: P7D
