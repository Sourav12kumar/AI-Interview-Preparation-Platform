spring:
  datasource:
    url: jdbc:h2:mem:interview_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  resume:
    storage-dir: target/test-resumes
    max-file-size: 5MB
    max-extracted-characters: 100000
  security:
    jwt:
      issuer: ai-interview-preparation-platform-test
      secret: integration-test-secret-that-is-longer-than-32-characters
      access-ttl: PT15M
      refresh-ttl: P7D
