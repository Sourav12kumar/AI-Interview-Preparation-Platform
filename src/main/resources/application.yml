spring:
  application:
    name: ai-interview-preparation-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_interview_prep?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:interview_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: AI Interview Preparation Platform
    version: 0.1.0

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  coding:
    runner:
      base-url: ${CODE_RUNNER_BASE_URL:}
      api-key: ${CODE_RUNNER_API_KEY:}
      connect-timeout: ${CODE_RUNNER_CONNECT_TIMEOUT:PT3S}
      request-timeout: ${CODE_RUNNER_REQUEST_TIMEOUT:PT10S}
  resume:
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
    max-extracted-characters: ${RESUME_MAX_EXTRACTED_CHARACTERS:100000}
  security:
    jwt:
      issuer: ai-interview-preparation-platform
      secret: ${JWT_SECRET}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}
